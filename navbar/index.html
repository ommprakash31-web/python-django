<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .logo{
            display: flex;
            align-items: center;
        }
        .logo img{
            width: 50px;
            height: 50px;
        }
        .navbar{
            display: flex;
            width: 60%;
            margin: auto;
            margin-top: 2rem;
            background: aqua;
            border-radius: 15px;
            padding: 20px;
            align-items: center;
            justify-content: space-evenly;
            position: fixed;
            left: 20%;
        }
        ul{
            display: flex;
            gap: 50px;
        
        }
        ul li{
            list-style: none;
        }
        li a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <section class="main-container">
        <header class="header">
            <nav class="navbar">
                <div class="logo">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIywA7vFO_6auHLE49SjJZVLWJXVlf50PuFJjDSjpYxQ&s" alt="">
                    <h2>OMM</h2>
                </div>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Login</a></li>
                </ul>
            </nav>
        </header>

        <section>

        </section>
    </section>
</body>
</html>
